<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — CasaNest</title>
  <meta name="description" content="Browse the full CasaNest collection. Filter by category and price, sort by popularity, price or newest." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumbs"><a href="index.html">Home</a> / <span id="crumbTitle">Shop</span></p>
      <h1 id="shopTitle">The Collection</h1>
      <p class="lead" style="margin-inline:auto" id="shopSub">Considered pieces for every room, chosen to last.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap shop-layout">
      <!-- FILTERS -->
      <aside class="filters" id="filters">
        <div class="filter-block">
          <h4>Categories</h4>
          <ul class="filter-list" id="catFilter"></ul>
        </div>
        <div class="filter-block">
          <h4>Price range</h4>
          <div class="price-range">
            <input type="range" id="priceRange" min="0" max="110000" value="110000" step="1000" />
            <div class="out">Up to <b id="priceOut">₹1,10,000</b></div>
          </div>
        </div>
        <div class="filter-block">
          <h4>Availability</h4>
          <ul class="filter-list">
            <li><button data-stock="all" class="active">All items</button></li>
            <li><button data-stock="in">In stock only</button></li>
          </ul>
        </div>
        <button class="btn btn--ghost btn--block btn--sm" id="resetFilters">Reset filters</button>
      </aside>

      <!-- RESULTS -->
      <div>
        <div class="shop-toolbar">
          <button class="btn btn--ghost btn--sm filter-toggle" id="filterToggle">Filters</button>
          <span class="count" id="resultCount"></span>
          <select class="select" id="sortSelect" aria-label="Sort products">
            <option value="popular">Sort: Popularity</option>
            <option value="newest">Sort: Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Rating: Highest</option>
          </select>
        </div>
        <div class="product-grid" id="shopGrid"></div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const state = {
      cat: params.get("cat") || "all",
      q: (params.get("q") || "").toLowerCase(),
      maxPrice: 110000,
      stock: "all",
      sort: "popular"
    };

    // Build category filter list
    function renderCatFilter() {
      const items = [["all", "All products", PRODUCTS.length]].concat(
        CATEGORIES.map((c) => [c, c, PRODUCTS.filter((p) => p.category === c).length])
      );
      $("#catFilter").innerHTML = items.map(([val, label, n]) =>
        `<li><button data-cat="${val}" class="${state.cat === val ? "active" : ""}">${label}<span>${n}</span></button></li>`
      ).join("");
    }

    function apply() {
      let list = PRODUCTS.slice();
      if (state.cat !== "all") list = list.filter((p) => p.category === state.cat);
      if (state.q) list = list.filter((p) =>
        p.name.toLowerCase().includes(state.q) || p.category.toLowerCase().includes(state.q));
      list = list.filter((p) => p.price <= state.maxPrice);
      if (state.stock === "in") list = list.filter((p) => p.stock);

      switch (state.sort) {
        case "price-asc": list.sort((a, b) => a.price - b.price); break;
        case "price-desc": list.sort((a, b) => b.price - a.price); break;
        case "rating": list.sort((a, b) => b.rating - a.rating); break;
        case "newest": list.sort((a, b) => (b.badge === "new") - (a.badge === "new")); break;
        default: list.sort((a, b) => b.reviews - a.reviews);
      }

      const grid = $("#shopGrid");
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <h3 style="font-family:var(--serif);font-size:24px;color:var(--ink);margin-bottom:6px">No matches found</h3>
          <p>Try adjusting your filters or search.</p></div>`;
      } else {
        grid.innerHTML = list.map(productCard).join("");
        initReveals();
      }
      $("#resultCount").textContent = `${list.length} product${list.length !== 1 ? "s" : ""}`;
    }

    // Header / title
    function updateTitle() {
      const t = state.cat === "all" ? (state.q ? `Results for “${state.q}”` : "The Collection") : state.cat;
      $("#shopTitle").textContent = t;
      $("#crumbTitle").textContent = state.cat === "all" ? "Shop" : state.cat;
      if (state.q) $("#shopSub").textContent = `Showing pieces matching your search.`;
    }

    // Events
    $("#catFilter").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      state.cat = b.dataset.cat; state.q = "";
      renderCatFilter(); updateTitle(); apply();
      $("#filters").classList.remove("open");
    });
    $("#priceRange").addEventListener("input", (e) => {
      state.maxPrice = +e.target.value;
      $("#priceOut").textContent = money(state.maxPrice);
      apply();
    });
    $$("[data-stock]").forEach((b) => b.addEventListener("click", () => {
      $$("[data-stock]").forEach((x) => x.classList.remove("active"));
      b.classList.add("active"); state.stock = b.dataset.stock; apply();
    }));
    $("#sortSelect").addEventListener("change", (e) => { state.sort = e.target.value; apply(); });
    $("#resetFilters").addEventListener("click", () => {
      state.cat = "all"; state.q = ""; state.maxPrice = 110000; state.stock = "all"; state.sort = "popular";
      $("#priceRange").value = 110000; $("#priceOut").textContent = "₹1,10,000";
      $("#sortSelect").value = "popular";
      $$("[data-stock]").forEach((x) => x.classList.toggle("active", x.dataset.stock === "all"));
      renderCatFilter(); updateTitle(); apply();
    });
    $("#filterToggle").addEventListener("click", () => $("#filters").classList.toggle("open"));

    bindCards($("#shopGrid"));
    renderCatFilter(); updateTitle(); apply();

    // Re-render once the live catalog arrives from the backend
    document.addEventListener("products:updated", () => { renderCatFilter(); apply(); });
  </script>
</body>
</html>
